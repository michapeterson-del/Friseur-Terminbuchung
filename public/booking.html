<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deine Buchung</title>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/" id="brand"><span id="nav-name">Salon</span></a>
      <a class="btn btn-small" href="/termine">Meine Termine</a>
    </div>
  </header>

  <main class="container narrow" id="app" style="padding-top: var(--space-7)"><p class="secondary">Wird geladen …</p></main>

  <script type="module">
    import { api, esc, euro, duration, fmtDateLong, icons, statusPill, toast } from '/js/common.js';
    import { rememberToken } from '/js/mybookings.js';
    rememberToken(location.pathname.split('/')[2]);
    document.getElementById('brand').insertAdjacentHTML('afterbegin', icons.scissors);
    const token = location.pathname.split('/')[2];
    const app = document.getElementById('app');

    const TEXT = {
      pending: ['Anfrage gesendet', 'Der Salon prüft deinen Wunschtermin. Diese Seite aktualisiert sich automatisch – speichere sie dir am besten als Lesezeichen.', icons.clock],
      confirmed: ['Termin bestätigt', 'Wir freuen uns auf dich!', icons.check],
      declined: ['Termin abgelehnt', 'Der Salon kann diesen Termin leider nicht anbieten. Wähle gern eine andere Uhrzeit.', icons.x],
      cancelled: ['Termin storniert', 'Dieser Termin findet nicht statt.', icons.x],
    };

    let last;
    async function load() {
      try {
        const b = await api(`/api/bookings/${token}`);
        if (last && last !== b.status) toast(`Status: ${TEXT[b.status][0]}`);
        last = b.status;
        document.getElementById('nav-name').textContent = b.salon.name;
        render(b);
      } catch (e) {
        app.innerHTML = `<div class="alert"><span class="dot"></span>${esc(e.message)}</div>`;
      }
    }

    function render(b) {
      const [title, sub, icon] = TEXT[b.status];
      const canCancel = b.status === 'pending' || b.status === 'confirmed';
      app.innerHTML = `
        <div class="stack">
          <div class="stack-sm" style="text-align:center">
            <div class="big-icon ${b.status}">${icon}</div>
            <h1>${title}</h1>
            <p class="secondary">${sub}</p>
            <div>${statusPill(b.status)}</div>
          </div>
          <div class="card ticket">
            <div class="ticket-top">
              <p class="eyebrow">${esc(b.salon.name)}</p>
              <div class="ticket-date">${fmtDateLong(b.date)}</div>
              <div class="ticket-time">${b.start} – ${b.end} Uhr</div>
            </div>
            <div class="ticket-cut" aria-hidden="true"></div>
            <div class="ticket-bottom">
              <dl class="summary">
                <dt>Leistung</dt><dd>${esc(b.service.name)} · ${duration(b.service.duration)}</dd>
                ${b.service.price != null ? `<dt>Preis</dt><dd>${euro(b.service.price)}</dd>` : ''}
                <dt>Name</dt><dd>${esc(b.customer.name)}</dd>
                ${b.salon.address ? `<dt>Adresse</dt><dd>${esc(b.salon.address)}</dd>` : ''}
                ${b.salon.phone ? `<dt>Telefon</dt><dd><a href="tel:${esc(b.salon.phone.replace(/[^\d+]/g, ''))}">${esc(b.salon.phone)}</a></dd>` : ''}
              </dl>
            </div>
          </div>
          ${b.message ? `<div class="card compact stack-sm"><p class="eyebrow">Nachricht vom Salon</p><p>${esc(b.message)}</p></div>` : ''}
          <div class="stack-sm">
            ${b.status === 'declined' || b.status === 'cancelled' ? `<a class="btn btn-primary btn-block" href="/">Neuen Termin wählen</a>` : ''}
            ${canCancel ? `<button class="btn btn-primary btn-block" id="ics">${icons.calendar.replace('<svg', '<svg width="18" height="18"')} Zum Kalender hinzufügen</button>` : ''}
            ${canCancel ? '<button class="btn btn-block" id="cancel"><span class="dot" style="background:var(--color-red)" aria-hidden="true"></span>Termin stornieren</button>' : ''}
          </div>
        </div>`;
      document.getElementById('ics')?.addEventListener('click', () => downloadIcs(b));
      document.getElementById('cancel')?.addEventListener('click', async (e) => {
        if (!confirm('Möchtest du diesen Termin wirklich stornieren?')) return;
        e.target.disabled = true;
        try {
          render(await api(`/api/bookings/${token}/cancel`, { method: 'POST' }));
          last = 'cancelled';
        } catch (ex) { toast(ex.message); e.target.disabled = false; }
      });
    }

    // Kalender-Datei (.ics) – öffnet auf iPhone/Mac direkt Apple Kalender, sonst Google/Outlook-Import
    function downloadIcs(b) {
      const stamp = (date, time) => `${date.replace(/-/g, '')}T${time.replace(':', '')}00`;
      const escIcs = (v) => String(v || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
      const lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Friseur-Terminbuchung//DE', 'CALSCALE:GREGORIAN',
        'BEGIN:VTIMEZONE', 'TZID:Europe/Berlin',
        'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0200', 'TZNAME:CEST', 'DTSTART:19700329T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
        'BEGIN:STANDARD', 'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0100', 'TZNAME:CET', 'DTSTART:19701025T030000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD',
        'END:VTIMEZONE',
        'BEGIN:VEVENT',
        `UID:${b.id}@friseur-terminbuchung`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
        `DTSTART;TZID=Europe/Berlin:${stamp(b.date, b.start)}`,
        `DTEND;TZID=Europe/Berlin:${stamp(b.date, b.end)}`,
        `SUMMARY:${escIcs(`${b.service.name} – ${b.salon.name}`)}`,
        b.salon.address ? `LOCATION:${escIcs(b.salon.address)}` : '',
        `DESCRIPTION:${escIcs(`Status und Stornieren: ${location.href}`)}`,
        `URL:${location.href}`,
        'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:Friseurtermin', 'END:VALARM',
        'END:VEVENT', 'END:VCALENDAR',
      ].filter(Boolean);
      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Friseurtermin-${b.date}.ics`;
      document.body.append(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }

    load();
    setInterval(() => { if (last === 'pending' && !document.hidden) load(); }, 15000);
  </script>
</body>
</html>
